apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "2"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "200m"
  - name: MEMORY_REQUEST
    description: JVM working set. Higher than a Node backend would need.
    value: "768Mi"
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: "2Gi"
  - name: LOG_LEVEL
    description: Application log level (DEBUG|INFO|WARN|ERROR)
    value: "INFO"
  - name: SPRING_PROFILES_ACTIVE
    value: ""
  # ---------------------------------------------------------------------------
  # BC Gov SSO (Keycloak). Replaces the AWS Cognito user pool.
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_ISSUER_URI
    description: Keycloak realm issuer URI
    required: true
  - name: FAM_OIDC_CLIENT_ID
    description: >-
      FAM's own Keycloak client id. Tokens on the internal API must carry this as
      their authorized party; /external is exempt.
    required: true
  - name: FAM_DEPLOYMENT_ENVIRONMENT
    description: >-
      dev, test or prod. Only "prod" allows the PROD instances of the Forest
      Client API and IDIM proxy to be reached.
    value: "dev"
  # ---------------------------------------------------------------------------
  # Secret holding the Keycloak client id for every downstream application, keyed
  # as FLYWAY_PLACEHOLDERS_CLIENT_ID_<ENV>_<APP>_OIDC_CLIENT. Consumed by the
  # migrations init container. See migrations/README.md.
  # ---------------------------------------------------------------------------
  - name: OIDC_CLIENTS_SECRET
    description: Name of the secret holding the per-application OIDC client ids
    value: oidc-clients
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          initContainers:
            # The database is on-prem and is NOT deployed by this repo. This only
            # checks reachability; it never provisions anything.
            - name: wait-for-db
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-host
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-port
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for on-prem database ${DB_HOST}:${DB_PORT} to be reachable..."
                  max_retries=30
                  attempt=1
                  until nc -z -v -w3 "${DB_HOST}" "${DB_PORT}"; do
                    if [ "$attempt" -ge "$max_retries" ]; then
                      echo "ERROR: Database ${DB_HOST}:${DB_PORT} is not reachable after ${max_retries} attempts." >&2
                      exit 1
                    fi
                    echo "Database not ready (attempt ${attempt}/${max_retries}), sleeping..."
                    attempt=$((attempt + 1))
                    sleep 2
                  done
                  echo "Database is UP!"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
            - name: migrations
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              imagePullPolicy: Always
              envFrom:
                # Per-application Keycloak client ids substituted into the
                # seed-data migrations. Absent values fail the migration rather
                # than seeding a bogus client.
                - secretRef:
                    name: ${OIDC_CLIENTS_SECRET}
                    optional: false
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-host
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-port
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: FLYWAY_URL
                  value: jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DATABASE)
                - name: FLYWAY_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: FLYWAY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: FLYWAY_SCHEMAS
                  value: "app_fam"
                # Deliberately NOT baselining on migrate: the full V1..V93
                # history is present, so an unexpectedly non-empty schema should
                # fail loudly rather than silently skip migrations.
                - name: FLYWAY_BASELINE_ON_MIGRATE
                  value: "false"
              resources:
                requests:
                  cpu: 10m
                  memory: 50Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: SPRING_PROFILES_ACTIVE
                  value: ${SPRING_PROFILES_ACTIVE}
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-host
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-port
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: POSTGRES_SCHEMA
                  value: "app_fam"
                - name: KEYCLOAK_ISSUER_URI
                  value: ${KEYCLOAK_ISSUER_URI}
                - name: FAM_OIDC_CLIENT_ID
                  value: ${FAM_OIDC_CLIENT_ID}
                - name: FAM_DEPLOYMENT_ENVIRONMENT
                  value: ${FAM_DEPLOYMENT_ENVIRONMENT}
                  # Unused while Caddy proxies /api (same-origin), but kept
                  # correct so a future direct-route setup is not silently broken.
                - name: ALLOW_ORIGIN
                  value: https://${NAME}-${ZONE}.${DOMAIN}
              # Integration credentials (Forest Client API, IDIM proxy, GC Notify)
              # and the CMENG shared secret. Created out of band, not by this repo.
              envFrom:
                - secretRef:
                    name: ${NAME}-${ZONE}-integrations
                    optional: true
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              # JVM start-up is slower than Node's; allow up to 150s before the
              # container is considered failed.
              startupProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              # No preStop hook: the distroless java image has no shell, and
              # Spring Boot's graceful shutdown (server.shutdown=graceful, 20s
              # drain) covers in-flight requests within the 30s grace period.
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}

apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.gold.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "2"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "200m"
  - name: MEMORY_REQUEST
    description: JVM working set. Higher than a Node backend would need.
    value: "768Mi"
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: "2Gi"
  - name: LOG_LEVEL
    description: Application log level (DEBUG|INFO|WARN|ERROR)
    value: "INFO"
  # Container timezone. Drives the JVM default zone, which is what the log
  # pattern's %d renders against - an OpenShift container is UTC by default,
  # which puts every log line 7-8 hours off the BC business day.
  #
  # A parameter rather than an ENV in the Dockerfile, so it can be changed per
  # environment without rebuilding the image. A named zone resolves from the
  # tzdb bundled inside the JDK, so the base image needs no OS tzdata package.
  #
  # Do NOT add -Duser.timezone to the ENTRYPOINT: it would override TZ and make
  # this parameter silently ineffective.
  - name: TZ
    description: IANA timezone for the container, e.g. America/Vancouver
    value: America/Vancouver
  - name: SPRING_PROFILES_ACTIVE
    value: ""
  # ---------------------------------------------------------------------------
  # BC Gov SSO (Keycloak). Replaces the AWS Cognito user pool.
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_ISSUER_URI
    description: Keycloak realm issuer URI
    required: true
  - name: FAM_OIDC_CLIENT_ID
    description: >-
      FAM's own Keycloak client id. Tokens on the internal API must carry this as
      their authorized party; /external is exempt.
    required: true
  - name: CSS_API_URL
    description: CSS API base URL
    value: https://api.loginproxy.gov.bc.ca/api/v1
  - name: CSS_TOKEN_URL
    description: Token endpoint for the CSS API account's client_credentials grant
    value: https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token
  - name: CSS_OWN_INTEGRATION_ID
    description: >-
      FAM's own CSS integration id. Administering FAM is deciding who administers
      every other application, so that integration is reserved to FAM_ADMIN.
      Nothing in a CSS response marks it, so FAM has to be told. Left empty the
      protection cannot be applied and startup logs a warning - deliberately not
      required, so a PR preview without the variable still deploys.
    required: false
    value: ""
  - name: FAM_DEPLOYMENT_ENVIRONMENT
    description: >-
      dev, test or prod. Only "prod" allows the PROD instances of the Forest
      Client API and IDIM proxy to be reached.
    value: "dev"
  # ---------------------------------------------------------------------------
  # Forest Client API. Two published instances, and which one a request uses is
  # decided per *application* environment, not per deployment: only a PROD
  # application on the PROD deployment reaches the PROD instance. FAM PROD also
  # administers DEV and TEST applications, and those must not see live client
  # data. ApiInstanceEnvResolver holds that rule.
  #
  # The instances hold different data, so a client number that resolves in one
  # need not resolve in the other - which is the point. Test data exists only in
  # TEST, and searching PROD from a lower environment would not find it.
  #
  # Supplied by the deploy from the repository variables fc_api_base_url_test and
  # fc_api_base_url_prod, not defaulted here: an endpoint that moves should be a
  # settings change, not a code change. They are public hostnames published in
  # the BC API Service Portal directory - only the keys are secret.
  #
  # A blank base URL disables that instance outright: the application logs
  # "Forest Client API <ENV> instance not configured" at start-up and every
  # forest-client search against it fails. For PROD that is the correct state
  # everywhere except the PROD deployment, which is why neither is required.
  # ---------------------------------------------------------------------------
  - name: FC_API_BASE_URL_TEST
    description: >-
      Forest Client API TEST instance, used by every non-PROD application. Blank
      disables forest-client search for them.
    required: false
    value: ""

  - name: FC_API_BASE_URL_PROD
    description: >-
      Forest Client API PROD instance, reached only by a PROD application on the
      PROD deployment. Blank everywhere else, which is intended.
    required: false
    value: ""
  # ---------------------------------------------------------------------------
  # Outbound mail. Two settings only; everything else the mail client accepts
  # (port, reply-to, auth, STARTTLS) keeps the application default, which suits
  # the BC Gov relay: port 25, unauthenticated, no TLS upgrade.
  #
  # SMTP_HOST is the switch: left blank the application logs "No SMTP host
  # configured" once at startup and every grant completes without notifying
  # anyone. SMTP_FROM is required to actually send - a relay rejects a message
  # with no envelope sender - so the application refuses to send with one and
  # not the other rather than failing per-message.
  # ---------------------------------------------------------------------------
  - name: SMTP_HOST
    description: Mail relay host. Blank disables sending entirely.
    value: ""
  - name: SMTP_FROM
    description: Envelope sender. Required for any mail to be sent.
    value: ""
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: TZ
                  value: ${TZ}
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: SPRING_PROFILES_ACTIVE
                  value: ${SPRING_PROFILES_ACTIVE}
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-host
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-port
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: POSTGRES_SCHEMA
                  value: "app_fam"
                - name: KEYCLOAK_ISSUER_URI
                  value: ${KEYCLOAK_ISSUER_URI}
                - name: FAM_OIDC_CLIENT_ID
                  value: ${FAM_OIDC_CLIENT_ID}
                - name: FAM_DEPLOYMENT_ENVIRONMENT
                  value: ${FAM_DEPLOYMENT_ENVIRONMENT}
                # BC Gov Common Hosted Single Sign-On: applications, roles and
                # role assignments. Credentials come from the secret created by
                # common/openshift.init.yml; the URLs and aliases are not secret.
                - name: CSS_API_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-css
                      key: css-api-client-id
                - name: CSS_API_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-css
                      key: css-api-client-secret
                # Outbound mail. No credentials: the BC Gov relay accepts
                # unauthenticated mail from inside the network, so the client
                # keeps its defaults of port 25, no auth and no STARTTLS.
                - name: SMTP_HOST
                  value: ${SMTP_HOST}
                - name: SMTP_FROM
                  value: ${SMTP_FROM}
                - name: CSS_API_URL
                  value: ${CSS_API_URL}
                - name: CSS_TOKEN_URL
                  value: ${CSS_TOKEN_URL}
                - name: CSS_OWN_INTEGRATION_ID
                  value: ${CSS_OWN_INTEGRATION_ID}
                # Forest Client API. Both instance slots are populated, and
                # ApiInstanceEnvResolver decides per request which one a call
                # uses. Base URLs are public and come from the parameters above;
                # the keys are secret and come from common/openshift.init.yml.
                - name: FC_API_BASE_URL_TEST
                  value: ${FC_API_BASE_URL_TEST}
                - name: FC_API_BASE_URL_PROD
                  value: ${FC_API_BASE_URL_PROD}
                # Separate keys, not one key used twice: the portal issues a
                # distinct key per instance. The PROD key is blank outside the
                # PROD deployment, by design.
                - name: FC_API_TOKEN_TEST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-forest-client
                      key: fc-api-token-test
                - name: FC_API_TOKEN_PROD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-forest-client
                      key: fc-api-token-prod
                # nr-user-lookup-api. Every value comes from the secret created
                # by common/openshift.init.yml, whose client id and secret CI
                # provisions rather than a human configuring them.
                - name: USER_LOOKUP_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-user-lookup
                      key: user-lookup-base-url
                - name: USER_LOOKUP_TOKEN_URL
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-user-lookup
                      key: user-lookup-token-url
                - name: USER_LOOKUP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-user-lookup
                      key: user-lookup-client-id
                - name: USER_LOOKUP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-user-lookup
                      key: user-lookup-client-secret
                  # Unused while Caddy proxies /api (same-origin), but kept
                  # correct so a future direct-route setup is not silently broken.
                - name: ALLOW_ORIGIN
                  value: https://${NAME}-${ZONE}.${DOMAIN}
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              # JVM start-up is slower than Node's; allow up to 150s before the
              # container is considered failed.
              startupProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              # No preStop hook: the distroless java image has no shell, and
              # Spring Boot's graceful shutdown (server.shutdown=graceful, 20s
              # drain) covers in-flight requests within the 30s grace period.
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 8080
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}

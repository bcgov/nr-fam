# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      db_host:
        description: Hostname of the on-prem PostgreSQL instance
        required: true
      db_name:
        description: Database name on the on-prem instance
        required: true
      db_port:
        description: Port of the on-prem PostgreSQL instance
        required: false
      db_user:
        description: Runtime application role (created by the DBA team)
        required: true
      db_password:
        description: Password for the runtime application role
        required: true
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      css_api_client_id:
        description: CSS API service account client id
        required: false
      css_api_client_secret:
        description: CSS API service account client secret
        required: false
      # One set per environment. nr-user-lookup-api is deployed three times and
      # each instance is behind its own Keycloak, so provisioning the service
      # account needs an admin client in each realm. Every deployment takes all
      # three: the instance used follows the application being administered, so a
      # PROD FAM reads TEST when it administers a TEST application.
      #
      # All optional. Absent on PR previews, and absent for any environment not
      # yet provisioned - the backend then refuses lookups for that environment
      # by name rather than falling back to another instance.
      keycloak_sa_client_id_dev:
        description: DEV Keycloak admin client used to provision FAM's user-lookup service account
        required: false
      keycloak_sa_client_secret_dev:
        description: Secret for the DEV Keycloak admin client above
        required: false
      user_lookup_base_url_dev:
        description: Base URL of the DEV nr-user-lookup-api
        required: false
      keycloak_sa_client_id_test:
        description: TEST Keycloak admin client used to provision FAM's user-lookup service account
        required: false
      keycloak_sa_client_secret_test:
        description: Secret for the TEST Keycloak admin client above
        required: false
      user_lookup_base_url_test:
        description: Base URL of the TEST nr-user-lookup-api
        required: false
      keycloak_sa_client_id_prod:
        description: PROD Keycloak admin client used to provision FAM's user-lookup service account
        required: false
      keycloak_sa_client_secret_prod:
        description: Secret for the PROD Keycloak admin client above
        required: false
      user_lookup_base_url_prod:
        description: Base URL of the PROD nr-user-lookup-api
        required: false
      fc_api_token_test:
        description: >-
          Forest Client API key for the API's TEST instance, which every non-PROD
          application uses. Needed in all three environments.
        required: false
      fc_api_token_prod:
        description: >-
          Forest Client API key for the API's PROD instance. Set this on the prod
          environment only - a lower environment has no use for it and should not
          hold it.
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    env:
      # Job-level so each step's `if:` below can read it - a step's own `env` is
      # not available to that step's own `if`.
      #
      # One admin client per realm, because the service account this provisions
      # has to exist in each of the three Keycloaks nr-user-lookup-api's
      # instances sit behind. An environment left unset simply is not
      # provisioned, and the backend then refuses lookups for that environment by
      # name rather than falling back to another instance.
      KC_SA_CLIENT_ID_DEV: ${{ secrets.keycloak_sa_client_id_dev }}
      KC_SA_CLIENT_ID_TEST: ${{ secrets.keycloak_sa_client_id_test }}
      KC_SA_CLIENT_ID_PROD: ${{ secrets.keycloak_sa_client_id_prod }}
    steps:
      # The deployer action checks out internally, but the Keycloak script runs
      # before it, so check out here to make ./.github/scripts available.
      - uses: actions/checkout@v6

      # Idempotently create FAM's user-lookup service-account client in each
      # realm and assign the scopes nr-user-lookup-api enforces.
      #
      # Three steps rather than one, and not a matrix: a matrix is a separate job
      # per entry, and step outputs do not cross jobs - the deploy below needs
      # all three client ids and secrets in one place. Each is skipped when its
      # admin credentials are absent, which is a PR preview and any environment
      # not yet provisioned; the backend then refuses lookups for that
      # environment by name.

      - name: Ensure Keycloak service account (DEV)
        id: keycloak_sa_dev
        if: ${{ env.KC_SA_CLIENT_ID_DEV != '' }}
        env:
          # Deliberately NOT keycloak_issuer_uri. The service account is created
          # in the realm nr-user-lookup-api validates against, not the realm
          # users sign in to - see the script header.
          USER_LOOKUP_ISSUER_URI: ${{ vars.user_lookup_issuer_uri_dev }}
          KC_SA_CLIENT_ID: ${{ env.KC_SA_CLIENT_ID_DEV }}
          KC_SA_CLIENT_SECRET: ${{ secrets.keycloak_sa_client_secret_dev }}
        run: ./.github/scripts/ensure-keycloak-service-account.sh

      - name: Ensure Keycloak service account (TEST)
        id: keycloak_sa_test
        if: ${{ env.KC_SA_CLIENT_ID_TEST != '' }}
        env:
          # Deliberately NOT keycloak_issuer_uri. The service account is created
          # in the realm nr-user-lookup-api validates against, not the realm
          # users sign in to - see the script header.
          USER_LOOKUP_ISSUER_URI: ${{ vars.user_lookup_issuer_uri_test }}
          KC_SA_CLIENT_ID: ${{ env.KC_SA_CLIENT_ID_TEST }}
          KC_SA_CLIENT_SECRET: ${{ secrets.keycloak_sa_client_secret_test }}
        run: ./.github/scripts/ensure-keycloak-service-account.sh

      - name: Ensure Keycloak service account (PROD)
        id: keycloak_sa_prod
        if: ${{ env.KC_SA_CLIENT_ID_PROD != '' }}
        env:
          # Deliberately NOT keycloak_issuer_uri. The service account is created
          # in the realm nr-user-lookup-api validates against, not the realm
          # users sign in to - see the script header.
          USER_LOOKUP_ISSUER_URI: ${{ vars.user_lookup_issuer_uri_prod }}
          KC_SA_CLIENT_ID: ${{ env.KC_SA_CLIENT_ID_PROD }}
          KC_SA_CLIENT_SECRET: ${{ secrets.keycloak_sa_client_secret_prod }}
        run: ./.github/scripts/ensure-keycloak-service-account.sh

      # Installs oc and logs in, so the step below can talk to the cluster. No
      # commands of its own - the secrets must reach the shell through the
      # environment, and a plain `run:` is the only place that is guaranteed.
      - name: OpenShift login
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}

      # Every credential the deployment needs, created here rather than in
      # common/openshift.init.yml.
      #
      # The template route ran each value through `oc process`, which renders one
      # JSON string the deployer can echo when debug is on - and GitHub's masking
      # only redacts values that still match the registered literal, which a
      # JSON-escaped secret no longer does. Here the values never enter a
      # template: they arrive as environment variables and go straight to `oc`,
      # which reads them as argument values rather than as anything to render.
      #
      # `--dry-run=client -o yaml | oc apply -f -` rather than `oc create`, so a
      # rerun updates rather than failing on an existing Secret.
      #
      # The app label is what PR cleanup deletes by (`cleanup: label` in
      # pr-close.yml). Without it a preview namespace would keep its secrets
      # after the pull request closed.
      - name: Create credential secrets
        env:
          APP: ${{ github.event.repository.name }}-${{ inputs.target }}
          # On-prem PostgreSQL. This repo deploys no database; these say how to
          # reach one.
          DB_HOST: ${{ secrets.db_host }}
          DB_PORT: ${{ secrets.db_port || '5432' }}
          DB_NAME: ${{ secrets.db_name }}
          DB_USER: ${{ secrets.db_user }}
          DB_PASSWORD: ${{ secrets.db_password }}
          # CSS API account. Confidential: backend-only, and never in the
          # frontend ConfigMap the browser fetches.
          CSS_API_CLIENT_ID: ${{ secrets.css_api_client_id }}
          CSS_API_CLIENT_SECRET: ${{ secrets.css_api_client_secret }}
          # nr-user-lookup-api, one instance per environment. Hosts come from
          # secrets, token URLs are derived from each realm's issuer, and the
          # client ids and secrets are whatever the three provisioning steps
          # above minted - blank for any environment not provisioned, which the
          # backend then refuses lookups for by name.
          UL_BASE_URL_DEV: ${{ secrets.user_lookup_base_url_dev }}
          UL_TOKEN_URL_DEV: ${{ vars.user_lookup_issuer_uri_dev != '' && format('{0}/protocol/openid-connect/token', vars.user_lookup_issuer_uri_dev) || '' }}
          UL_CLIENT_ID_DEV: ${{ steps.keycloak_sa_dev.outputs.client_id }}
          UL_CLIENT_SECRET_DEV: ${{ steps.keycloak_sa_dev.outputs.client_secret }}
          UL_BASE_URL_TEST: ${{ secrets.user_lookup_base_url_test }}
          UL_TOKEN_URL_TEST: ${{ vars.user_lookup_issuer_uri_test != '' && format('{0}/protocol/openid-connect/token', vars.user_lookup_issuer_uri_test) || '' }}
          UL_CLIENT_ID_TEST: ${{ steps.keycloak_sa_test.outputs.client_id }}
          UL_CLIENT_SECRET_TEST: ${{ steps.keycloak_sa_test.outputs.client_secret }}
          UL_BASE_URL_PROD: ${{ secrets.user_lookup_base_url_prod }}
          UL_TOKEN_URL_PROD: ${{ vars.user_lookup_issuer_uri_prod != '' && format('{0}/protocol/openid-connect/token', vars.user_lookup_issuer_uri_prod) || '' }}
          UL_CLIENT_ID_PROD: ${{ steps.keycloak_sa_prod.outputs.client_id }}
          UL_CLIENT_SECRET_PROD: ${{ steps.keycloak_sa_prod.outputs.client_secret }}
          # Forest Client API keys. The PROD key belongs only to the PROD
          # deployment; blank elsewhere is the intended configuration.
          FC_API_TOKEN_TEST: ${{ secrets.fc_api_token_test }}
          FC_API_TOKEN_PROD: ${{ secrets.fc_api_token_prod }}
        run: |
          set -euo pipefail

          # No `set -x` anywhere in this step, deliberately: it would print the
          # --from-literal arguments, which is the leak this step exists to close.

          if ! oc whoami >/dev/null 2>&1; then
            echo "::error::Not logged in to OpenShift; the login step above did not take effect."
            exit 1
          fi

          apply_secret() {
            local name="$1"; shift
            oc create secret generic "${name}" "$@" \
              --dry-run=client -o yaml | oc apply -f - >/dev/null
            oc label secret "${name}" "app=${APP}" --overwrite >/dev/null
            echo "  ${name}"
          }

          echo "Applying credential secrets:"

          apply_secret "${APP}-database" \
            --from-literal=database-host="${DB_HOST}" \
            --from-literal=database-port="${DB_PORT}" \
            --from-literal=database-name="${DB_NAME}" \
            --from-literal=database-user="${DB_USER}" \
            --from-literal=database-password="${DB_PASSWORD}"

          apply_secret "${APP}-css" \
            --from-literal=css-api-client-id="${CSS_API_CLIENT_ID}" \
            --from-literal=css-api-client-secret="${CSS_API_CLIENT_SECRET}"

          apply_secret "${APP}-user-lookup" \
            --from-literal=user-lookup-base-url-dev="${UL_BASE_URL_DEV}" \
            --from-literal=user-lookup-token-url-dev="${UL_TOKEN_URL_DEV}" \
            --from-literal=user-lookup-client-id-dev="${UL_CLIENT_ID_DEV}" \
            --from-literal=user-lookup-client-secret-dev="${UL_CLIENT_SECRET_DEV}" \
            --from-literal=user-lookup-base-url-test="${UL_BASE_URL_TEST}" \
            --from-literal=user-lookup-token-url-test="${UL_TOKEN_URL_TEST}" \
            --from-literal=user-lookup-client-id-test="${UL_CLIENT_ID_TEST}" \
            --from-literal=user-lookup-client-secret-test="${UL_CLIENT_SECRET_TEST}" \
            --from-literal=user-lookup-base-url-prod="${UL_BASE_URL_PROD}" \
            --from-literal=user-lookup-token-url-prod="${UL_TOKEN_URL_PROD}" \
            --from-literal=user-lookup-client-id-prod="${UL_CLIENT_ID_PROD}" \
            --from-literal=user-lookup-client-secret-prod="${UL_CLIENT_SECRET_PROD}"

          apply_secret "${APP}-forest-client" \
            --from-literal=fc-api-token-test="${FC_API_TOKEN_TEST}" \
            --from-literal=fc-api-token-prod="${FC_API_TOKEN_PROD}"

      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters: -p KEYCLOAK_ISSUER_URI="${{ vars.keycloak_issuer_uri }}"
            -p KEYCLOAK_CLIENT_ID="${{ vars.keycloak_client_id }}"
            -p TARGET_ENV="${{ inputs.environment || 'dev' }}"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          # ---------------------------------------------------------------
          # debug MUST stay false here, and there is no input to turn it on.
          #
          # This template is the one that carries Secret stringData - database,
          # CSS, and the three user-lookup service accounts. The deployer builds
          # the template with `oc process`, which substitutes every -p value, so
          # the string it holds contains those credentials in clear. With debug
          # true it echoes that string (twice, around the lite-mode edits), and
          # GitHub's masking only redacts values that still match the registered
          # literal - a secret containing a quote or a backslash is JSON-escaped
          # by `oc process` and no longer matches.
          #
          # The echo is inside the lite-mode branch, so today it fires on PR
          # previews rather than on environment deploys. That is a detail of the
          # action, not a guarantee: it is pinned by SHA, and a later version is
          # free to log the template anywhere.
          #
          # If you need diagnostics here, blank the credential-bearing
          # parameters first. The deployment still applies; the backend just
          # refuses lookups at call time.
          # ---------------------------------------------------------------
          debug: false

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
              -p KEYCLOAK_ISSUER_URI="${{ vars.keycloak_issuer_uri }}"
              -p FAM_OIDC_CLIENT_ID="${{ vars.keycloak_client_id }}"
              -p FAM_DEPLOYMENT_ENVIRONMENT="${{ inputs.environment || 'dev' }}"
              -p CSS_API_URL="${{ vars.css_api_url || 'https://api.loginproxy.gov.bc.ca/api/v1' }}"
              -p CSS_TOKEN_URL="${{ vars.css_token_url || 'https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token' }}"
              -p CSS_OWN_INTEGRATION_ID="${{ vars.css_own_integration_id }}"
              -p SMTP_HOST="${{ vars.smtp_host }}"
              -p SMTP_FROM="${{ vars.smtp_from }}"
              -p FC_API_BASE_URL_TEST="${{ vars.fc_api_base_url_test }}"
              -p FC_API_BASE_URL_PROD="${{ vars.fc_api_base_url_prod }}"
          - name: frontend
            file: frontend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Off here too, though these templates reference their credentials
          # through secretKeyRef and so carry no values of their own. It was on,
          # and it was safe only for as long as that stayed true - one -p
          # carrying a secret into this matrix would have started logging it
          # with nothing to catch the change.
          debug: false
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p MIN_REPLICAS="${{ inputs.environment == 'prod' && '3' || '2' }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}

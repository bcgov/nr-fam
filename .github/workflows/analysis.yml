name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs the full suite, including SchemaValidationIT: Testcontainers starts a
      # throwaway PostgreSQL, the application's own Flyway configuration applies
      # db/migration, and Hibernate validates every entity against the result. That is the only place the
      # entity mappings are checked against the real schema, so it must run here -
      # Docker is unavailable on most developer machines.
      - name: Test
        run: ./mvnw -B -ntp verify

      - name: Upload coverage
        if: (! cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/coverage-reports
          retention-days: 7

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token_backend }}
        run: ./mvnw -B -ntp sonar:sonar -Dsonar.projectKey=bcgov_nr-fam_backend

  # The OpenAPI document generates the frontend's API client, so drift between a
  # controller and the committed spec silently breaks the client. Regenerating
  # here and failing on a diff makes that impossible to merge unnoticed.
  openapi-spec:
    name: OpenAPI Spec Up To Date
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Regenerate spec
        working-directory: backend
        run: ./mvnw -B -ntp test -Dtest=OpenApiSpecGeneratorTest

      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --exit-code -- frontend/client-code-gen/fam-openapi.json; then
            echo "::error::fam-openapi.json is out of date."
            echo "Run: cd backend && ./mvnw test -Dtest=OpenApiSpecGeneratorTest"
            echo "Then regenerate the client: cd frontend/client-code-gen && npm ci && npm run gen-api-client"
            exit 1
          fi
          echo "OpenAPI spec is up to date."

  frontend-tests:
    name: Frontend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Deliberately does NOT install anything under client-code-gen. The
      # generated client declares axios as a peer dependency; installing inside it
      # would create a second axios, and TypeScript treats types reached through
      # different module paths as distinct - which fails the typecheck.
      - name: Install
        run: npm run install-frontend

      # No lint step: upstream FAM shipped no eslint config. `tsc` below is the
      # real static check, and it is the guard on the generated client matching
      # the app.
      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:cov

      - name: Build
        run: npm run build-only

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token_frontend }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=bcgov_nr-fam_frontend
            -Dsonar.sources=src
            -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/client-code-gen/**,**/*.spec.ts
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-v0.36.0-cache-v1
          restore-keys: |
            ${{ runner.os }}-trivy-

      # Reports every severity to the Security tab for triage.  Findings are not a merge
      # gate: advisories are published on their own schedule, not the contributor's, and
      # committed secrets are already blocked at push time by GitHub secret scanning.
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,**/target,.git"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Analysis Results
    needs: [backend-tests, openapi-spec, frontend-tests, trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"

name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/pr-open.yml')

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [builds]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_host: ${{ secrets.db_host }}
      db_name: ${{ secrets.db_name }}
      db_port: ${{ secrets.db_port }}
      db_user: ${{ secrets.db_user }}
      db_password: ${{ secrets.db_password }}
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      css_api_client_id: ${{ secrets.css_api_client_id }}
      css_api_client_secret: ${{ secrets.css_api_client_secret }}
      keycloak_sa_client_id_dev: ${{ secrets.keycloak_sa_client_id_dev }}
      keycloak_sa_client_secret_dev: ${{ secrets.keycloak_sa_client_secret_dev }}
      user_lookup_base_url_dev: ${{ secrets.user_lookup_base_url_dev }}
      keycloak_sa_client_id_test: ${{ secrets.keycloak_sa_client_id_test }}
      keycloak_sa_client_secret_test: ${{ secrets.keycloak_sa_client_secret_test }}
      user_lookup_base_url_test: ${{ secrets.user_lookup_base_url_test }}
      keycloak_sa_client_id_prod: ${{ secrets.keycloak_sa_client_id_prod }}
      keycloak_sa_client_secret_prod: ${{ secrets.keycloak_sa_client_secret_prod }}
      user_lookup_base_url_prod: ${{ secrets.user_lookup_base_url_prod }}
      fc_api_token_test: ${{ secrets.fc_api_token_test }}
      fc_api_token_prod: ${{ secrets.fc_api_token_prod }}
    with:
      target: ${{ github.event.number }}
      triggers: ('backend/', 'frontend/', 'common/', '.github/workflows/pr-open.yml')

  tests:
     name: Tests
     if: needs.deploys.outputs.triggered == 'true'
     needs: [deploys]
     # The E2E job checks the repository out to install and run Playwright. A
     # called workflow cannot hold more than its caller grants, and this file
     # sets `permissions: {}`, so without this the call is rejected outright -
     # "requesting 'contents: read', but is only allowed 'contents: none'".
     permissions:
       contents: read
     uses: ./.github/workflows/reusable-tests.yml
     with:
       # On by default for PRs: the suite writes only to the CSS sandbox, and a
       # permission screen that broke is exactly what a PR should catch. Set the
       # RUN_E2E repository variable to "false" to fall back to the smoke test
       # alone - during an SSO outage, say, where every run would fail on login.
       run_e2e: ${{ vars.RUN_E2E != 'false' }}
     secrets:
       e2e_idir_user: ${{ secrets.E2E_IDIR_USER }}
       e2e_idir_password: ${{ secrets.E2E_IDIR_PASSWORD }}
       e2e_target_idir: ${{ secrets.E2E_TARGET_IDIR }}

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"

name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Image Promotion
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    permissions:
      packages: write
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      # Must be passed explicitly. The called workflow declares oc_server as a
      # secret and falls back to `https://api.silver.devops.gov.bc.ca:6443` when
      # it is absent, so omitting it does not fail - it quietly points the
      # cleanup at the wrong cluster. It is a variable here, not a secret; a
      # cluster API URL is not sensitive and the deploy jobs read the same one.
      oc_server: ${{ vars.oc_server }}
    with:
      cleanup: label
      packages: backend frontend

apiVersion: template.openshift.io/v1
kind: Template

# ---------------------------------------------------------------------------
# No Secret is created here, and no credential is a parameter of this template.
#
# `oc process` substitutes every -p value into one string, and the deployer
# action can echo that string when debug is on. GitHub redacts registered secret
# values, but only where they still match the registered literal - `oc process`
# emits JSON, so a secret containing a quote or a backslash comes out escaped and
# slips past the mask.
#
# So the credential-bearing Secrets - database, css, user-lookup and
# forest-client - are created by reusable-deploy.yml with `oc create secret`,
# where the values reach the process through the environment and never enter a
# template. What is left here is addresses and names, which are safe to log.
#
# Anything added below that needs a credential belongs in that step, not in a
# parameter.
# ---------------------------------------------------------------------------
parameters:
  - name: NAME
    description: Product name
    value: nr-fam
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  # ---------------------------------------------------------------------------
  # Frontend runtime configuration. The SPA fetches /env.json into localStorage
  # before it mounts (public/env.js), so one built image can be promoted between
  # environments. The image ships a local-development env.json; this ConfigMap
  # replaces it at /srv/env.json in a deployed pod.
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_ISSUER_URI
    description: Keycloak realm issuer URI
    required: true
  - name: KEYCLOAK_CLIENT_ID
    description: FAM's own Keycloak client id, used by the browser
    required: true
  - name: TARGET_ENV
    description: dev, test or prod. Drives the environment banner in the UI.
    value: dev
  - name: DOMAIN
    value: apps.gold.devops.gov.bc.ca
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-frontend-env
      labels:
        app: ${NAME}-${ZONE}
    data:
      # Mounted over /srv/env.json. The nested "sensitive/type/value" shape is
      # what EnvUtils expects; it is carried over from the AWS-generated file so
      # the frontend reader did not have to change.
      #
      # The API base URL is RELATIVE: Caddy proxies /api to the backend Service
      # in-cluster and strips the prefix. That keeps the API same-origin, so
      # there is no CORS and no second Route, and it satisfies the frontend's
      # connect-src 'self' CSP.
      env.json: |
        {
          "fam_api_base_url": {
            "sensitive": false, "type": "string",
            "value": "/api"
          },
          "keycloak_issuer_uri": {
            "sensitive": false, "type": "string",
            "value": "${KEYCLOAK_ISSUER_URI}"
          },
          "keycloak_client_id": {
            "sensitive": false, "type": "string",
            "value": "${KEYCLOAK_CLIENT_ID}"
          },
          "front_end_redirect_base_url": {
            "sensitive": false, "type": "string",
            "value": "https://${NAME}-${ZONE}.${DOMAIN}"
          },
          "target_env": {
            "sensitive": false, "type": "string",
            "value": "${TARGET_ENV}"
          }
        }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-frontend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-backend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
      policyTypes:
        - Ingress

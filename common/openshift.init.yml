apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-fam
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  # ---------------------------------------------------------------------------
  # FAM runs against an on-prem PostgreSQL instance. This repo does not deploy a
  # database - there is no StatefulSet, no Patroni, no Crunchy operator. These
  # parameters describe how to *reach* that instance; they are supplied from
  # GitHub environment secrets/vars by reusable-deploy.yml.
  # ---------------------------------------------------------------------------
  - name: DB_HOST
    description: Hostname of the on-prem PostgreSQL instance
    required: true
  - name: DB_PORT
    description: Port of the on-prem PostgreSQL instance
    value: "5432"
  - name: DB_NAME
    description: Database name on the on-prem instance
    required: true
  - name: DB_USER
    description: Runtime application role (created by the DBA team; see migrations/dba/)
    required: true
  - name: DB_PASSWORD
    description: Password for the runtime application role
    required: true
  # ---------------------------------------------------------------------------
  # BC Gov Common Hosted Single Sign-On credentials. A confidential client: the
  # secret is backend-only and must never reach the frontend ConfigMap below,
  # which the browser fetches. The non-secret CSS settings (URLs, IdP aliases)
  # live on backend/openshift.deploy.yml, which is what reads them.
  # ---------------------------------------------------------------------------
  - name: CSS_API_CLIENT_ID
    description: CSS API account client id (CSS app -> My Teams -> CSS API Account)
    required: true
  - name: CSS_API_CLIENT_SECRET
    description: CSS API account client secret
    required: true
  # ---------------------------------------------------------------------------
  # nr-user-lookup-api, the shared BC Gov identity directory. Replaces the IDIM
  # proxy. The client id and secret are not configured by hand: CI provisions the
  # service-account client and assigns the scopes the API enforces - see
  # .github/scripts/ensure-keycloak-service-account.sh.
  #
  # All four are optional so a PR preview without the admin credentials still
  # deploys; the backend then fails identity lookups loudly at call time rather
  # than returning empty results.
  # ---------------------------------------------------------------------------
  - name: USER_LOOKUP_BASE_URL
    description: Scheme and host of nr-user-lookup-api
    required: false
    value: ""
  - name: USER_LOOKUP_TOKEN_URL
    description: Keycloak token endpoint for the service account's client_credentials grant
    required: false
    value: ""
  - name: USER_LOOKUP_CLIENT_ID
    description: Service-account client id, provisioned by CI
    required: false
    value: ""
  - name: USER_LOOKUP_CLIENT_SECRET
    description: Service-account client secret, read back by CI
    required: false
    value: ""

  # ---------------------------------------------------------------------------
  # Forest Client API key, sent as X-API-KEY. One key, because every environment
  # uses the same (PROD) instance - see backend/openshift.deploy.yml.
  #
  # Optional, and blank fails late rather than at startup: the instance still
  # initialises and the first forest-client search returns 401. Only a blank
  # base URL disables an instance outright.
  # ---------------------------------------------------------------------------
  - name: FC_API_TOKEN
    description: Forest Client API key, used by every environment
    required: false
    value: ""

  # ---------------------------------------------------------------------------
  # Frontend runtime configuration. The SPA fetches /env.json into localStorage
  # before it mounts (public/env.js), so one built image can be promoted between
  # environments. The image ships a local-development env.json; this ConfigMap
  # replaces it at /srv/env.json in a deployed pod.
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_ISSUER_URI
    description: Keycloak realm issuer URI
    required: true
  - name: KEYCLOAK_CLIENT_ID
    description: FAM's own Keycloak client id, used by the browser
    required: true
  - name: TARGET_ENV
    description: dev, test or prod. Drives the environment banner in the UI.
    value: dev
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-database
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      database-host: ${DB_HOST}
      database-port: ${DB_PORT}
      database-name: ${DB_NAME}
      database-user: ${DB_USER}
      database-password: ${DB_PASSWORD}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-css
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      css-api-client-id: ${CSS_API_CLIENT_ID}
      css-api-client-secret: ${CSS_API_CLIENT_SECRET}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-user-lookup
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      user-lookup-base-url: ${USER_LOOKUP_BASE_URL}
      user-lookup-token-url: ${USER_LOOKUP_TOKEN_URL}
      user-lookup-client-id: ${USER_LOOKUP_CLIENT_ID}
      user-lookup-client-secret: ${USER_LOOKUP_CLIENT_SECRET}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-forest-client
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      fc-api-token: ${FC_API_TOKEN}
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-frontend-env
      labels:
        app: ${NAME}-${ZONE}
    data:
      # Mounted over /srv/env.json. The nested "sensitive/type/value" shape is
      # what EnvUtils expects; it is carried over from the AWS-generated file so
      # the frontend reader did not have to change.
      #
      # The API base URL is RELATIVE: Caddy proxies /api to the backend Service
      # in-cluster and strips the prefix. That keeps the API same-origin, so
      # there is no CORS and no second Route, and it satisfies the frontend's
      # connect-src 'self' CSP.
      env.json: |
        {
          "fam_api_base_url": {
            "sensitive": false, "type": "string",
            "value": "/api"
          },
          "keycloak_issuer_uri": {
            "sensitive": false, "type": "string",
            "value": "${KEYCLOAK_ISSUER_URI}"
          },
          "keycloak_client_id": {
            "sensitive": false, "type": "string",
            "value": "${KEYCLOAK_CLIENT_ID}"
          },
          "front_end_redirect_base_url": {
            "sensitive": false, "type": "string",
            "value": "https://${NAME}-${ZONE}.${DOMAIN}"
          },
          "target_env": {
            "sensitive": false, "type": "string",
            "value": "${TARGET_ENV}"
          }
        }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-frontend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-backend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
      policyTypes:
        - Ingress

# Local development stack.
#
# NOTE: the PostgreSQL service here is for DEVELOPMENT ONLY. FAM runs against an
# on-prem PostgreSQL instance that this repository does not deploy - there is no
# database in any OpenShift template. See migrations/README.md.

x-var:
  - &POSTGRES_USER postgres
  - &POSTGRES_PASSWORD default
  - &POSTGRES_DATABASE postgres

x-postgres-vars: &postgres-vars
  POSTGRES_HOST: database
  POSTGRES_PORT: "5432"
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  POSTGRES_DATABASE: *POSTGRES_DATABASE

services:
  database:
    image: postgres:17-alpine
    container_name: fam-database
    environment:
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      POSTGRES_DB: *POSTGRES_DATABASE
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]

  # Applies its own migrations on start-up: the SQL ships inside the jar, so
  # there is no separate migrations container to sequence before this one.
  backend:
    container_name: fam-backend
    build:
      context: ./backend
    environment:
      <<: *postgres-vars
      POSTGRES_SCHEMA: app_fam
      SPRING_PROFILES_ACTIVE: local
      LOG_LEVEL: DEBUG
      # Point at a real BC Gov SSO realm to sign in locally. Left unset, the app
      # still starts - JWKS is fetched lazily, not at boot - but every
      # authenticated call will be rejected.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-https://dev.loginproxy.gov.bc.ca/auth/realms/standard}
      # Blank skips the FAM-client check; see FamClientTokenFilter.
      FAM_OIDC_CLIENT_ID: ${FAM_OIDC_CLIENT_ID:-}
      FAM_DEPLOYMENT_ENVIRONMENT: dev
      ALLOW_ORIGIN: http://localhost:3000
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: fam-frontend
    image: node:22
    working_dir: /app
    # install-frontend deliberately installs nothing under client-code-gen: the
    # generated client declares axios as a peer dependency, and a second copy
    # would break the typecheck.
    entrypoint: sh -c "npm run install-frontend && npm run dev -- --host"
    environment:
      # The dev server proxies /api here, matching the Caddy setup in production.
      VITE_BACKEND_URL: http://backend:8080
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="favicon.ico" />
        <!--
      Important to preload static environment settings 'env.json' first at run time.
      It is to prepare for later App needs, especially the OIDC client configuration for BC Gov SSO login.
      Some reference here: https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/rel/preload
    -->
        <link
            rel="preload"
            href="/env.json"
            as="fetch"
            crossorigin="anonymous"
            type="application/json"
        />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FAM - Forests Access Management</title>
        <script src="/env.js"></script>
    </head>
    <body id="fam-body" class="fam-body">
        <div id="main-body">
            <div id="app"></div>
            <div class="modals"></div>
        </div>
        <script type="module" src="src/main.ts"></script>
    </body>
</html>

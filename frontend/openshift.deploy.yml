apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: frontend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "2"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "50m"
  - name: MEMORY_REQUEST
    value: "50Mi"
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: "1Gi"
  - name: LOG_LEVEL
    description: Caddy log level (debug|info|warn|error)
    value: "info"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          # No wait-for-backend init container. The frontend does not need the
          # backend to start: Caddy serves the SPA, and the API is reached
          # through it at /api only once the browser makes a call. Gating
          # start-up on the backend meant a backend outage took the frontend
          # down with it - and after 30 attempts the init container exited 1,
          # failing the pod rather than serving anything.
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
                - name: health
                  containerPort: 3001
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: BACKEND_URL
                  value: http://${NAME}-${ZONE}-backend
                # readOnlyRootFilesystem: true → redirect every writable path
                # onto an emptyDir. Caddy stores config/data under the XDG dirs
                # (mounted at /tmp/caddy); Coraza writes SecTmpDir/SecDataDir
                # under /tmp/coraza; generic temp files go to TMPDIR.
                - name: XDG_CONFIG_HOME
                  value: /tmp/caddy
                - name: XDG_DATA_HOME
                  value: /tmp/caddy
                - name: TMPDIR
                  value: /tmp/caddy
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: caddy-data
                  mountPath: /tmp/caddy
                - name: coraza-tmp
                  mountPath: /tmp/coraza
                # Replaces the local-development env.json baked into the image
                # with this environment's settings. The SPA fetches it before it
                # mounts, so one image can be promoted across environments.
                - name: frontend-env
                  mountPath: /srv/env.json
                  subPath: env.json
                  readOnly: true
              startupProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sleep", "10"]
          volumes:
            - name: caddy-data
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: coraza-tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: frontend-env
              configMap:
                name: ${NAME}-${ZONE}-frontend-env
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      host: ${NAME}-${ZONE}.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-${ZONE}-${COMPONENT}
        weight: 100
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}

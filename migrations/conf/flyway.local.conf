# Local-development Flyway configuration.
#
# Deliberately almost empty. Until the V1 baseline this file supplied 51
# OIDC client-id placeholders for the seed data that populated
# app_fam.fam_application_client. That table went to CSS, no migration
# substitutes a placeholder any more, and the deployed pipeline no longer needs
# FLYWAY_PLACEHOLDERS_* secrets for the same reason.
#
# Kept as a file because docker-compose mounts it; delete the mount and this
# can go too.

flyway.placeholderReplacement=false

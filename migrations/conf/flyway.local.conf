# Local-development Flyway configuration.
#
# Used only by docker-compose. Supplies dummy values for the OIDC client-id
# placeholders that the seed-data migrations substitute into
# app_fam.fam_application_client.
#
# Deployed environments deliberately have NO defaults for these: they are
# supplied as FLYWAY_PLACEHOLDERS_<NAME> environment variables sourced from an
# OpenShift secret, so a missing Keycloak client id fails the migration loudly
# instead of silently seeding a bogus client.
#
# These were AWS Cognito client ids upstream; on Keycloak they are the client
# ids of each downstream application's Keycloak client. The column is still
# named cognito_client_id - see the backend auth task for the rename.

flyway.placeholderReplacement=true

flyway.placeholders.client_id_dev_apt3_oidc_client=local-dummy-dev_apt3
flyway.placeholders.client_id_dev_apt_oidc_client=local-dummy-dev_apt
